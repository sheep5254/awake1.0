  hik_camera:
    #target_sn: DA4973922 #海康2
    target_sn: 00J38611357 #海康1
    adc_bit_depth: Bits_8
    pixel_format: BayerRG8 #RGB8Packed
    reverse_x: false
    reverse_y: false
    width: 1280
    height: 720
    center_roi: true    # OffsetX/OffsetY 按 WidthMax/HeightMax 自动居中，不写死
    offset_x: 0         # 仅 center_roi=false 时生效
    offset_y: 0
    flip: "180"         # 相机倒装补偿：none/vertical/horizontal/180，识别前软件翻转
    acquisition_frame_rate_enable: true
    # 180 fps → 每帧 5.56ms；配合 auto_exposure.exposure_max=3000µs 留出 2.5ms
